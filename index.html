<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0;font-size:14px}[hidden]{display:none!important}</style>
<title>Muestrario de Color</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  /* Layout: barra superior + tira de muestras a pantalla completa (columnas en escritorio, filas en móvil) + historial */
  :root {
    --bg: #f3f3f6;
    --surface: #ffffff;
    --fg: #17171c;
    --muted: #6b6b78;
    --line: #dcdce3;
    --accent: #3b3bd6;
    --font-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121217; --surface: #1c1c23; --fg: #ececf1; --muted: #9a9aa8; --line: #2e2e38; --accent: #8c8cff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121217; --surface: #1c1c23; --fg: #ececf1; --muted: #9a9aa8; --line: #2e2e38; --accent: #8c8cff;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: var(--font-display);
    display: flex; flex-direction: column;
  }
  .wrap {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
    padding-block: 14px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 1.35rem; font-weight: 700; margin: 0; letter-spacing: -0.01em; }
  .hint { color: var(--muted); font-size: 0.85rem; }
  kbd {
    font-family: var(--font-mono); font-size: 0.75rem;
    border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px;
    padding: 1px 6px; background: var(--surface); color: var(--fg);
  }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button { font: inherit; cursor: pointer; }
  button:focus-visible, .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn {
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    padding: 8px 14px; border-radius: 8px; font-weight: 500; font-size: 0.9rem;
  }
  .btn.primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    border: 0; background: var(--surface); color: var(--muted);
    padding: 8px 10px; font-family: var(--font-mono); font-size: 0.8rem;
  }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

  main { flex: 1; display: flex; min-height: 0; }
  .swatch {
    flex: 1; min-width: 0; position: relative;
    display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
    gap: 10px; padding: 24px 8px 32px;
    border: 0; cursor: pointer;
    transition: flex-grow .25s ease, background-color .3s ease;
  }
  .swatch:hover { flex-grow: 1.25; }
  .code {
    font-family: var(--font-mono); font-weight: 600;
    font-size: clamp(1rem, 2.2vw, 1.6rem); letter-spacing: 0.02em;
  }
  .name { font-size: 0.8rem; opacity: 0.75; text-align: center; }
  .copy-tag {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em;
    opacity: 0; transition: opacity .2s;
  }
  .swatch:hover .copy-tag, .swatch:focus-visible .copy-tag { opacity: 0.8; }
  .lock {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    width: 38px; height: 38px; border-radius: 50%;
    border: 1.5px solid currentColor; background: transparent; color: inherit;
    display: grid; place-items: center; opacity: 0.45;
  }
  .lock:hover, .lock[aria-pressed="true"] { opacity: 1; }
  .lock[aria-pressed="true"] { background: currentColor; }
  .lock[aria-pressed="true"] svg { stroke: var(--lock-ink); }
  .lock svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }

  footer { padding-block: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 12px; min-width: 0; }
  footer .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; flex-shrink: 0; }
  .history { display: flex; gap: 6px; overflow-x: auto; min-width: 0; padding-block: 2px; }
  .chip {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 6px;
    border: 1px solid var(--line);
  }

  .toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 20px); opacity: 0;
    background: var(--fg); color: var(--bg);
    font-family: var(--font-mono); font-size: 0.9rem;
    padding: 10px 16px; border-radius: 8px; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 20;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 700px) {
    main { flex-direction: column; }
    .swatch { flex-direction: row; justify-content: space-between; padding: 0 20px 0 70px; }
    .swatch:hover { flex-grow: 1; }
    .lock { left: 16px; top: 50%; transform: translateY(-50%); }
    .copy-tag { display: none; }
    .hint { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

<header class="wrap">
  <div>
    <h1>Muestrario de Color</h1>
    <div class="hint">Pulsá <kbd>Espacio</kbd> para generar · click en un color para copiarlo</div>
  </div>
  <div class="controls">
    <div class="seg" role="group" aria-label="Formato a copiar">
      <button id="fmt-hex" data-fmt="hex" aria-pressed="true">HEX</button>
      <button id="fmt-rgb" data-fmt="rgb" aria-pressed="false">RGB</button>
      <button id="fmt-hsl" data-fmt="hsl" aria-pressed="false">HSL</button>
    </div>
    <button class="btn" id="copy-all">Copiar paleta</button>
    <button class="btn primary" id="generate">Generar</button>
  </div>
</header>

<main id="palette" aria-label="Paleta"></main>

<footer class="wrap">
  <span class="label">Copiados</span>
  <div class="history" id="history"></div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const COUNT = 5;
  const palette = document.getElementById('palette');
  const historyEl = document.getElementById('history');
  const toastEl = document.getElementById('toast');
  let format = 'hex';
  let colors = []; // { h, s, l, locked }
  let history = [];

  try { const f = localStorage.getItem('fmt'); if (f) format = f; } catch (e) {}
  try { history = JSON.parse(localStorage.getItem('history') || '[]'); } catch (e) { history = []; }

  function hslToRgb(h, s, l) {
    s /= 100; l /= 100;
    const k = n => (n + h / 30) % 12;
    const a = s * Math.min(l, 1 - l);
    const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [f(0), f(8), f(4)].map(v => Math.round(v * 255));
  }
  const toHex = c => '#' + hslToRgb(c.h, c.s, c.l).map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  function fmt(c, f = format) {
    if (f === 'rgb') return `rgb(${hslToRgb(c.h, c.s, c.l).join(', ')})`;
    if (f === 'hsl') return `hsl(${Math.round(c.h)}, ${Math.round(c.s)}%, ${Math.round(c.l)}%)`;
    return toHex(c);
  }
  function luminance(c) {
    const [r, g, b] = hslToRgb(c.h, c.s, c.l).map(v => {
      v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * r + 0.7152 * g + 0.0722 * b;
  }
  function hueName(c) {
    if (c.s < 12) return c.l > 80 ? 'Blanco roto' : c.l < 20 ? 'Casi negro' : 'Gris';
    const names = [[15,'Rojo'],[40,'Naranja'],[65,'Amarillo'],[90,'Lima'],[150,'Verde'],[185,'Turquesa'],[210,'Celeste'],[250,'Azul'],[280,'Violeta'],[320,'Magenta'],[345,'Rosa'],[361,'Rojo']];
    const base = names.find(([max]) => c.h < max)[1];
    const tone = c.l > 72 ? ' claro' : c.l < 30 ? ' oscuro' : '';
    return base + tone;
  }

  // Paleta armónica: tono base + variaciones, con saturación y luz agradables
  function generate() {
    const base = Math.random() * 360;
    const mode = Math.floor(Math.random() * 3);
    colors = Array.from({ length: COUNT }, (_, i) => {
      if (colors[i]?.locked) return colors[i];
      let h;
      if (mode === 0) h = base + i * (360 / COUNT) * 0.35;           // análoga
      else if (mode === 1) h = base + (i % 2 ? 180 : 0) + i * 8;     // complementaria
      else h = Math.random() * 360;                                   // libre
      return {
        h: ((h % 360) + 360) % 360,
        s: 40 + Math.random() * 50,
        l: 25 + Math.random() * 55,
        locked: false,
      };
    });
    render();
  }

  const lockSvg = locked => locked
    ? '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>'
    : '<svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/></svg>';

  function render() {
    palette.innerHTML = '';
    colors.forEach((c, i) => {
      const dark = luminance(c) < 0.4;
      const ink = dark ? '#ffffff' : '#111114';
      const el = document.createElement('div');
      el.className = 'swatch';
      el.tabIndex = 0;
      el.setAttribute('role', 'button');
      el.setAttribute('aria-label', `Copiar ${fmt(c)}`);
      el.style.backgroundColor = toHex(c);
      el.style.color = ink;
      el.style.setProperty('--lock-ink', toHex(c));
      el.innerHTML = `
        <button class="lock" aria-pressed="${c.locked}" aria-label="${c.locked ? 'Desbloquear' : 'Bloquear'} color" title="Bloquear (no cambia al generar)">${lockSvg(c.locked)}</button>
        <div>
          <div class="code">${fmt(c)}</div>
          <div class="name">${hueName(c)}</div>
        </div>
        <div class="copy-tag">Click para copiar</div>`;
      el.addEventListener('click', e => {
        if (e.target.closest('.lock')) { c.locked = !c.locked; render(); return; }
        copy(fmt(c), toHex(c));
      });
      el.addEventListener('keydown', e => {
        if (e.key === 'Enter') { e.preventDefault(); copy(fmt(c), toHex(c)); }
      });
      palette.appendChild(el);
    });
  }

  function copy(text, hex) {
    const done = () => {
      toast(`Copiado ${text}`);
      if (hex) addHistory(hex);
    };
    if (navigator.clipboard?.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
    } else fallbackCopy(text, done);
  }
  function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) {}
    ta.remove();
    ok ? done() : toast(`Seleccioná y copiá: ${text}`);
  }

  function addHistory(hex) {
    history = [hex, ...history.filter(h => h !== hex)].slice(0, 30);
    try { localStorage.setItem('history', JSON.stringify(history)); } catch (e) {}
    renderHistory();
  }
  function renderHistory() {
    historyEl.innerHTML = history.length ? '' : '<span class="hint" style="display:inline">Aún no copiaste ningún color</span>';
    history.forEach(hex => {
      const b = document.createElement('button');
      b.className = 'chip'; b.style.background = hex; b.title = hex;
      b.setAttribute('aria-label', `Copiar ${hex}`);
      b.addEventListener('click', () => copy(hex, hex));
      historyEl.appendChild(b);
    });
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1600);
  }

  function setFormat(f) {
    format = f;
    document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.fmt === f));
    try { localStorage.setItem('fmt', f); } catch (e) {}
    render();
  }

  document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setFormat(b.dataset.fmt)));
  document.getElementById('generate').addEventListener('click', generate);
  document.getElementById('copy-all').addEventListener('click', () => copy(colors.map(c => fmt(c)).join(', ')));
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && !['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName) && e.target.getAttribute('role') !== 'button') {
      e.preventDefault(); generate();
    }
  });

  setFormat(format);
  generate();
  renderHistory();
</script>
